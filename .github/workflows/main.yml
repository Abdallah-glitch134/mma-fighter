name: Build MMA Fighter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract MMA Fighter source package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="MMA_Fighter_2_0_1_GITHUB_SOURCE_CLEAN.zip"
          test -f "$ZIP"
          rm -rf mma-project
          mkdir mma-project
          unzip -q "$ZIP" -d mma-project
          test -f mma-project/package.json
          test -f mma-project/capacitor.config.json
          test -f mma-project/www/index.html

      - name: Install npm dependencies
        working-directory: mma-project
        run: npm install --no-audit --no-fund

      - name: Create Android project
        working-directory: mma-project
        run: npx cap add android

      - name: Sync web app into Android
        working-directory: mma-project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mma-project/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mma-fighter-debug-apk
          path: mma-project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
